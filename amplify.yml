version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - test -n "$VITE_API_URL" || (echo "Set VITE_API_URL in Amplify environment variables" && exit 1)
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
